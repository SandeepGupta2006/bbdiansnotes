<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z1J099MRKG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-Z1J099MRKG');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Notes & PYQs Viewer | BBDians Notes - BBD University</title>
    <meta name="description"
        content="View and download BBD University subject modules, unit-wise notes, and previous year question papers online.">
    
    <link rel="icon" href="https://bbdiansnotes.in/assets/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="https://bbdiansnotes.in/assets/icon.png">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/viewer.css">

</head>

<body>

    <header class="site-header">
        <div class="logo"><a href="/">BBDians Notes</a></div>
        <div id="subjectTitle" style="font-weight: 600;">Loading Subject...</div>
        <a href="notes.html" class="secondary-btn back-icon" style="padding: 8px 15px; font-size: 12px;">← Back</a>
    </header>

    <div class="viewer-layout container">

        <aside class="viewer-sidebar">
            <div class="sidebar-section">
                <h4>Course Modules</h4>
                <div id="moduleList">
                </div>
            </div>

            <div class="sidebar-section" style="margin-top: 30px;">
                <h4>Previous Year Papers</h4>
                <div id="pyqList">
                </div>
            </div>
        </aside>

        <main class="pdf-container">
            <div class="pdf-header">
                
                <div class="mobile-guide" id="mobileGuide">
                    <div class="guide-box">
                        Tap to switch modules
                    </div>
                </div>

                <button id="mobileSidebarToggle" class="secondary-btn"
                    style="display: none; padding: 8px 12px; margin-right: 10px;">☰</button>

                <h2 id="currentDocTitle">Select a module</h2>

                <a id="downloadBtn" href="#" class="primary-btn" style="padding: 10px 20px;" download>Download 📥</a>
            </div>

            <div class="mobile-subject" id="mobileSubject"></div>

            <div class="pdf-wrapper">
                <iframe id="mainPdfFrame" src=""></iframe>
            </div>
        </main>
    </div>

    <div class="menu-overlay" id="menuOverlay"></div>

    <script src="js/notesData.js"></script>
    <script src="js/viewer.js"></script>

    <script>
        const mobileToggle = document.getElementById("mobileSidebarToggle");
        const sidebar = document.querySelector(".viewer-sidebar");

        const overlay = document.createElement("div");
        overlay.className = "sidebar-overlay";
        document.body.appendChild(overlay);

        function toggleMobileMenu() {
            sidebar.classList.toggle("active");
            overlay.classList.toggle("active");
        }

        mobileToggle.addEventListener("click", toggleMobileMenu);
        overlay.addEventListener("click", toggleMobileMenu);

        document.addEventListener("click", (e) => {
            if (e.target.classList.contains("module-link") && window.innerWidth <= 992) {
                toggleMobileMenu();
            }
        });
    </script>

</body>

</html>
