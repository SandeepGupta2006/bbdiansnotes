<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - BBDians Notes</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">

    <link rel="shortcut icon" href="assets/icon.png" type="image/x-icon">
</head>

<body>

    <header class="site-header">
        <div class="logo"><a href="index.html">BBDians Notes</a></div>
        <nav class="menu" id="menu">
            <a href="index.html">Home</a>
            <a href="notes.html">Notes</a>
            <a href="about.html">About</a>
            <a href="feedback.html" class="active">Feedback</a>
            <a href="contribute.html">Contribute</a>
        </nav>

        <!-- <button id="themeToggle" class="theme-toggle">🌙</button> -->
        <button id="menuToggle" class="menu-toggle">☰</button>
    </header>

    <section class="notes-hero">
        <div class="container">
            <h1>Feedback</h1>
            <p>Help us improve the platform.</p>
        </div>
    </section>

    <section class="container" style="max-width:600px;padding-bottom:80px;">

        <form id="feedbackForm" action="https://formspree.io/f/mkoqedwa" method="POST" class="feedback-form">
        
            <input type="text" name="name" placeholder="Your name" required>
        
            <input type="email" name="email" placeholder="Your email" required>
        
            <textarea name="message" placeholder="Your feedback..." rows="5" required></textarea>
        
            <button type="submit" id="submitBtn">Send Feedback</button>
        
            <p id="formMessage"></p>
        
        </form>

    </section>

    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const form = document.getElementById("feedbackForm");

            if (!form) return;

            form.addEventListener("submit", async function (e) {

                e.preventDefault();

                const btn = document.getElementById("submitBtn");
                btn.textContent = "Sending...";
                btn.disabled = true;

                const data = new FormData(form);

                try {

                    const response = await fetch(form.action, {
                        method: "POST",
                        body: data,
                        headers: {
                            "Accept": "application/json"
                        }
                    });

                    if (response.ok) {

                        form.innerHTML = `
    <div class="form-success">
    <h2>Thank You!</h2>
    <p>Your feedback has been submitted successfully.</p>
    <a href="index.html" class="back-home">Back to Home</a>
    </div>
    `;

                    } else {

                        const error = await response.json();
                        alert(error.error || "Submission failed");

                        btn.textContent = "Send Feedback";
                        btn.disabled = false;

                    }

                } catch {

                    alert("Network error. Please try again.");

                    btn.textContent = "Send Feedback";
                    btn.disabled = false;

                }

            });

        });

    </script>

    <footer class="site-footer">
        <p>© 2026 BBDians Notes. Built for the BBD community.</p>
    </footer>

    <div class="menu-overlay" id="menuOverlay"></div>

    <script src="js/script.js"></script>

</body>

</html>
