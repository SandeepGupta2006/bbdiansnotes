<!DOCTYPE html>
<html lang="en">

<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z1J099MRKG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-Z1J099MRKG');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feedback & Suggestions | BBDians Notes - Help Us Grow</title>
    <meta name="description"
        content="Have suggestions for BBDians Notes? Send us your feedback or report missing notes for BBD University Lucknow. We value your input!">

    <link rel="icon" href="https://bbdiansnotes.in/assets/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="https://bbdiansnotes.in/assets/icon.png">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
</head>

<body>

    <header class="site-header">
        <div class="logo"><a href="/">BBDians Notes</a></div>
        <nav class="menu" id="menu">
            <a href="/">Home</a>
            <a href="notes.html">Notes</a>
            <a href="about.html">About</a>
            <a href="feedback.html" class="active">Feedback</a>
            <a href="contribute.html">Contribute</a>
        </nav>
        <button id="menuToggle" class="menu-toggle" aria-label="Toggle Menu">☰</button>
    </header>

    <main>
        <section class="notes-hero">
            <div class="container">
                <h1>Feedback</h1>
                <p>Help us improve the platform for the BBD University community.</p>
            </div>
        </section>

        <section class="container" style="max-width:600px;padding-bottom:80px;">
            <form id="feedbackForm" action="https://formspree.io/f/mkoqedwa" method="POST" class="feedback-form"
                aria-label="Feedback Form">

                <input type="text" name="name" placeholder="Your name" required aria-label="Full Name">

                <input type="email" name="email" placeholder="Your email" required aria-label="Email Address">

                <textarea name="message" placeholder="What notes are missing? How can we improve?" rows="5" required
                    aria-label="Feedback Message"></textarea>

                <button type="submit" id="submitBtn">Send Feedback</button>

                <p id="formMessage"></p>
            </form>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("feedbackForm");
            if (!form) return;
            form.addEventListener("submit", async function (e) {
                e.preventDefault();
                const btn = document.getElementById("submitBtn");
                btn.textContent = "Sending...";
                btn.disabled = true;
                const data = new FormData(form);
                try {
                    const response = await fetch(form.action, {
                        method: "POST",
                        body: data,
                        headers: { "Accept": "application/json" }
                    });
                    if (response.ok) {
                        form.innerHTML = `
                            <div class="form-success" style="text-align:center; padding: 40px 0;">
                                <h2>Thank You!</h2>
                                <p>Your feedback helps us make BBDians Notes better.</p>
                                <a href="index.html" class="primary-btn" style="display:inline-block; margin-top:20px;">Back to Home</a>
                            </div>`;
                    } else {
                        const error = await response.json();
                        alert(error.error || "Submission failed");
                        btn.textContent = "Send Feedback";
                        btn.disabled = false;
                    }
                } catch {
                    alert("Network error. Please try again.");
                    btn.textContent = "Send Feedback";
                    btn.disabled = false;
                }
            });
        });
    </script>

    <footer class="site-footer">
        <p>© 2026 BBDians Notes. The ultimate study hub for BBD University students.</p>
    </footer>

    <div class="menu-overlay" id="menuOverlay"></div>
    <script src="js/script.js"></script>

</body>

</html>
