<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contribute - BBDians Notes</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">

    <link rel="shortcut icon" href="assets/icon.png" type="image/x-icon">
</head>

<body>

    <header class="site-header">
        <div class="logo"><a href="index.html">BBDians Notes</a></div>
        <nav class="menu" id="menu">
            <a href="index.html">Home</a>
            <a href="notes.html">Notes</a>
            <a href="about.html">About</a>
            <a href="feedback.html">Feedback</a>
            <a href="contribute.html" class="active">Contribute</a>
        </nav>

        <!-- <button id="themeToggle" class="theme-toggle">🌙</button> -->
        <button id="menuToggle" class="menu-toggle">☰</button>
    </header>

    <section class="notes-hero">
        <div class="container">
    
            <h1>Contribute Notes</h1>
            <p>Help other students by sharing Notes or PYQs.</p>
    
        </div>
    </section>

    <section class="container" style="max-width:650px;padding-bottom:80px;">
    
        <form id="contributeForm" action="https://formspree.io/f/mreydngz" method="POST" class="feedback-form">
    
            <input type="text" name="name" placeholder="Your Name" required>
    
            <input type="email" name="email" placeholder="Your Email" required>
    
            <input type="text" name="subject" placeholder="Subject" required>

            <input type="text" name="branch" placeholder="Branch" required>
    
            <input type="text" name="semester" placeholder="Semester" required>

            <input type="url" name="link" placeholder="Google Drive / Dropbox link" required>
    
            <textarea name="message" rows="4" placeholder="Anything we should know about the notes or pyqs?"></textarea>
    
            <button type="submit" id="submitBtn">Submit Contribution</button>
    
        </form>
    
    </section>

    <script>

        const form = document.getElementById("contributeForm");

        if (form) {

            form.addEventListener("submit", async function (e) {

                e.preventDefault();

                const btn = document.getElementById("submitBtn");
                btn.textContent = "Submitting...";
                btn.disabled = true;

                const data = new FormData(form);

                const response = await fetch(form.action, {
                    method: "POST",
                    body: data,
                    headers: {
                        "Accept": "application/json"
                    }
                });

                if (response.ok) {

                    form.innerHTML = `
    <div class="form-success">
    <h2>Contribution received!</h2>
    <p>Thank you for helping other students.</p>
    <a href="index.html">Back to Home</a>
    </div>
    `;

                } else {
                    alert("Submission failed");
                    btn.textContent = "Submit Contribution";
                    btn.disabled = false;
                }

            });

        }

    </script>

    <footer class="site-footer">
        <p>© 2026 BBDians Notes. Built for the BBD community.</p>
    </footer>

    <div class="menu-overlay" id="menuOverlay"></div>

    <script src="js/script.js"></script>

</body>

</html>
