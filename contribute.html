<!DOCTYPE html>
<html lang="en">

<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z1J099MRKG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-Z1J099MRKG');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contribute Study Material | BBDians Notes - Share Your Knowledge</title>
    
    <meta name="description"
        content="Contribute your BBD University notes, previous year question papers, or practical files. Join the mission to help every BBDIAN ace their exams.">

    <link rel="icon" href="https://bbdiansnotes.in/assets/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="https://bbdiansnotes.in/assets/icon.png">

    <link rel="canonical" href="https://bbdiansnotes.in/contribute" />

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
</head>

<body>

    <header class="site-header">
        <div class="logo"><a href="/">BBDians Notes</a></div>
        <nav class="menu">
            <a href="/">Home</a>
            <a href="/notes">Notes</a>
            <a href="/about">About</a>
            <a href="/feedback">Feedback</a>
            <a href="/contribute" class="active">Contribute</a>
        </nav>
        <button id="menuToggle" class="menu-toggle" aria-label="Toggle Menu">☰</button>
    </header>

    <main>
        <section class="notes-hero">
            <div class="container">
                <h1>Contribute Notes & PYQs</h1>
                <p>Support the BBD University community by sharing your study materials.</p>
            </div>
        </section>

        <section class="container" style="max-width:650px;padding-bottom:80px;">

            <form id="contributeForm" action="https://formspree.io/f/mreydngz" method="POST" class="feedback-form"
                aria-label="Contribution Form">

                <input type="text" name="name" placeholder="Your Name" required aria-label="Full Name">

                <input type="email" name="email" placeholder="Your Email" required aria-label="Email Address">

                <input type="text" name="subject" placeholder="Subject Name (e.g., Cyber Security)" required
                    aria-label="Subject">

                <input type="text" name="branch" placeholder="Branch (e.g., B.Tech CSE)" required
                    aria-label="Academic Branch">

                <input type="text" name="semester" placeholder="Semester (e.g., 4th Sem)" required
                    aria-label="Semester">

                <input type="url" name="link" placeholder="Google Drive / Dropbox link to PDF" required
                    aria-label="File Link">

                <textarea name="message" rows="4" placeholder="Any details about these notes or year of PYQ?"
                    aria-label="Message"></textarea>

                <button type="submit" id="submitBtn">Submit Contribution</button>
            </form>
        </section>
    </main>

    <script>
        const form = document.getElementById("contributeForm");
        if (form) {
            form.addEventListener("submit", async function (e) {
                e.preventDefault();
                const btn = document.getElementById("submitBtn");
                btn.textContent = "Submitting...";
                btn.disabled = true;
                const data = new FormData(form);
                try {
                    const response = await fetch(form.action, {
                        method: "POST",
                        body: data,
                        headers: { "Accept": "application/json" }
                    });
                    if (response.ok) {
                        form.innerHTML = `
                            <div class="form-success" style="text-align:center; padding: 40px 0;">
                                <h2>Contribution received!</h2>
                                <p>Thank you for helping fellow BBD students. We will review and upload it soon.</p>
                                <a href="/" class="primary-btn" style="display:inline-block; margin-top:20px;">Back to Home</a>
                            </div>`;
                    } else {
                        alert("Submission failed. Please check the form and try again.");
                        btn.textContent = "Submit Contribution";
                        btn.disabled = false;
                    }
                } catch (err) {
                    alert("Network error. Please try again.");
                    btn.textContent = "Submit Contribution";
                    btn.disabled = false;
                }
            });
        }
    </script>

    <footer class="site-footer">
        <p>© 2026 BBDians Notes. The ultimate study hub for BBD University students.</p>
    </footer>

    <div class="menu-overlay" id="menuOverlay"></div>
    <script src="js/script.js"></script>

</body>

</html>
